<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        nav .left-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 200px 0 30px;
            /* border: 1px solid red; */
        }

        nav .left-nav h2 {
            font-family: sans-serif;
            font-weight: 50;
            gap: 20px;
        }

        nav .left-nav img {
            padding: 10px;
        }

        nav .left-nav i {
            padding: 20px;
        }

        nav .middle-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 250px;
        }

        nav .middle-nav input {
            width: 400px;
            height: 50px;
        }

        nav .right-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px 0 200px;
        }

        nav .right-nav i {
            padding: 10px;
        }

        nav .right-nav img {
            border-radius: 50px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="left-nav">
            <i class='bx bx-menu'></i>
            <img src="/nav/img/google-gmail-svgrepo-com.svg" alt="gmail logo" height="40px">
            <h2>Gmail</h2>
        </div>
        <div class="middle-nav">
            <input type="search" placeholder="        Search mail">
        </div>
        <div class="right-nav">
            <i class='bx bx-help-circle'></i>
            <i class='bx bx-cog'></i>
            <i class='bx bxs-grid'></i>
            <img src="/nav/img/profile1.jpg" alt="profile picture" height="40px">
        </div>
    </nav>
</body>

</html>
