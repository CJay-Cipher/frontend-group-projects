<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: center;

        }
        nav .left-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 650px;
        }
        nav .right-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 650px;
            width: 50px;
        }
        nav .right-nav i {
            padding: 0 20px;
            
        }
        nav .right-nav i:hover {
            background-color: rgb(136, 129, 129);
            color: white;
            border-radius: 50px;
            /* height: 20px;
            width: 0px; */
        }
        nav .right-nav img:hover {
            background-color: rgb(136, 129, 129);
            color: white;
            border-radius: 25px;
        }
        nav .right-nav .profile {
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="left-nav">
            <img src="/nav/img/medium-svgrepo-com (1).svg" alt="logo" height="90px">
        </div>
        <div class="right-nav">
            <i class='bx bx-search-alt-2'></i>
            <img src="/nav/img/ribbon-svgrepo-com.svg" alt="ribbon" height="20px">
            <i class='bx bxs-bell'></i>
            <img class="profile" src="/nav/img/profile1.jpg" alt="profile-picture" height="35px">
        </div>
    </nav>
    
</body>
</html>
