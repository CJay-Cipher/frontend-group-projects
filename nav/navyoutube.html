<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        nav .left-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 200px;
        }

        nav .left-nav i {
            font-size: 30px;
            color: red;
        }

        nav .left-nav .bx-menu {
            padding: 0 30px;
            color: black;
        }

        nav .left-nav p {
            font-size: 12px;
            padding-bottom: 10px;
            padding-left: 5px;
        }

        nav .search-nav {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav .search-nav input {
            padding: 0 30px;
            height: 41px;
            width: 800px;
        }

        nav .search-nav i {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 17px;
            height: 38px;
            padding: 0 10px;
            border-left: 0;
        }

        nav .search-nav i:hover {
            background-color: rgb(224, 39, 39);
            color: #fff;
        }

        nav .right-nav {
            display: flex;
            justify-content: end;
            align-items: center;
            padding: 0 200px;
        }

        nav .right-nav i {
            padding: 0 15px;
        }

        nav .right-nav img {
            width: 40px;
            border-radius: 50px;
        }
    </style>
</head>

<body>
    <nav>
        <div class="left-nav">
            <i class='bx bx-menu'></i>
            <i class='bx bxl-youtube'></i>
            <h1>Premium</h1>
            <p>BE</p>
        </div>
        <div class="search-nav">
            <input type="search" placeholder="youtube search"><i class='bx bx-search-alt-2'></i>
        </div>
        <div class="right-nav">
            <i class='bx bxs-video-plus'></i>
            <i class='bx bxs-grid'></i>
            <i class='bx bxs-bell'></i>
            <img src="/nav/img/profile1.jpg" alt="profile picture">
        </div>
    </nav>
</body>

</html>
