<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            /* background-color: rgb(228, 228, 228); */
        }
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 20px;
            margin: 20px;
        }
        nav .left-nav {
            display: flex;
            align-items: center;
            /* border: 1px solid red; */
            height: 56px;
        }
        nav .left-nav img {
            width: 40px;
            border: 20px;
        }
        nav .left-nav i {
            padding: 8px;
            background-color: goldenrod;
            border-radius: 50px;
        }
        nav .left-nav input {
            padding: 15px 20px;
            border-radius: 38px;
            border: none;
            background-color: rgb(228, 228, 228);
            /* background-image: url(/nav/img/bx-search.svg); */
            /* background-repeat: no-repeat; */
        }
        nav .left-nav input:focus {
            outline: none;
        }
        nav .middle-nav {
            flex: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 56px;
            color: rgb(133, 135, 136);
            /* border: 1px solid red; */
        }
        nav .middle-nav i {
            font-size: 28px;
            padding: 0 50px;
            margin: 0 5px;
            /* padding: 10px 20px; */
            cursor: pointer;
        }
        nav .middle-nav i:hover {
            color: rgb(78, 78, 230);
            background-color: rgb(189, 183, 176);
        }
        nav .middle-nav :active {
            color: rgb(78, 78, 230);
            border-radius: 0;
            border-bottom: rgb(78, 78, 230);
        }
        nav .right-nav {
            width: 300px;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* border: 1px solid red; */
        }
        nav .right-nav i {
            font-size: 28px;
            margin: 0 15px;
            padding: 10px;
            background-color: rgb(226, 221, 215);
            border-radius: 50px;
        }
        nav .right-nav img {
            width: 50px;
            border-radius: 50px;
            margin: 0 10px;
        }

    </style>
</head>
<body>
    <nav>
        <div class="left-nav">
            <img src="/nav/img/facebook-1-svgrepo-com.svg" alt="">
            <input type="search" placeholder="Search facebook"><i class='bx bx-search'></i>
        </div>
        <div class="middle-nav">
            <i class='bx bxs-home'></i>
            <i class='bx bx-flag'></i>
            <i class='bx bxl-youtube'></i>
            <i class='bx bx-store'></i>
            <i class='bx bx-menu'></i>
        </div>
        <div class="right-nav">
            <i class='bx bxs-grid'></i>
            <i class='bx bxl-messenger'></i>
            <i class='bx bxs-bell'></i>
            <img src="/nav/img/profile1.jpg" alt="">
        </div>
    </nav>

    
</body>
</html>
