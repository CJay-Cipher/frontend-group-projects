<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            height: 47px;
        }

        nav .left-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 300px 0 0;
        }

        nav .left-nav img {
            background-color: red;
            color: white;
            height: 47px;
        }

        nav .left-nav a {
            text-decoration: none;
            padding: 15px 20px;
            color: white;
            font-size: 15px;
            font-weight: 600;
        }

        nav .left-nav a:hover {
            background-color: red;
            
        }

        nav .right-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0 0 200px;
        }

        nav .right-nav i {
            color: white;
            font-size: 25px;
            padding: 20px;
        }
        nav .right-nav p {
            color: white;
            font-size: 17px;
            margin: 0;
        }
    </style>
</head>

<body>
    <nav>
        <div class="left-nav">
            <img src="/nav/img/cnn-svgrepo-com.svg" alt="logo" height="54px">
            <a href="#">Word</a>
            <a href="#">Us Politics</a>
            <a href="#">Business</a>
            <a href="#">Health</a>
            <a href="#">Entertainment</a>
            <a href="#">Style</a>
            <a href="#">Travel</a>
            <a href="#">Sports</a>
            <a href="#">Videos</a>
        </div>
        <div class="right-nav">
            <p>Edition</p><i class='bx bx-chevron-down'></i>
            <i class='bx bx-search-alt-2'></i>
            <i class='bx bx-user-circle'></i>
            <i class='bx bx-menu'></i>
        </div>
    </nav>
</body>

</html>
